#
# Packaging for the desktop builds (Windows installer, Linux AppImage and snap, macOS app). Everything
# under `resources/` is produced by ../build.ps1, linuxAppImage/build.sh or macDmg/build.sh and is
# gitignored — never hand-edited.

appId: no.usn.hdl-board
productName: HDLBoard
copyright: Copyright (C) 2026 Rune Langøy

directories:
  output: ../output
  buildResources: build

# Only the shell itself goes into app.asar. The backend, the frontend and
# GHDL and Icarus are extraResources instead — see below.
files:
  - main.js
  - backendPort.js
  - package.json

# These sit next to app.asar rather than inside it, under
# `resources/`. GHDL must be a real file on disk for spawn() to execute
# it, and the backend bundle has `ws` inlined precisely because module
# resolution does not reach into the asar from out here (plan F3).
extraResources:
  - from: resources/frontend
    to: frontend
  - from: resources/backend.mjs
    to: backend.mjs
  # window.hdlboard (project storage); resolvePaths() loads it from here.
  - from: resources/preload.js
    to: preload.js
  # { "persistProjects": true } — the packaged build's default. A dev run
  # has no resources/ and so stays off; see resolvePersistProjects().
  - from: resources/settings.default.json
    to: settings.default.json
  - from: resources/ghdl
    to: ghdl
  # Icarus Verilog: one flat directory, run with -B/-M (plan 5.8).
  - from: resources/iverilog
    to: iverilog

# HDLBoard's own GPL-2.0 text, beside the program on Windows (so license.txt's
# reference to it is true) and Linux, under `extraFiles` in those two sections.
# Not here for all three: on macOS it would land in HDLBoard.app/Contents/, where
# codesign accepts no loose file; the Mac app has it in Resources/licenses/.

# Linux: electron-builder lays the app out (`dir`, in linux-unpacked/) and
# linuxAppImage/build.sh packs that into the AppImage itself, for two things
# electron-builder 25's AppImage target cannot do: its own AppRun, which turns
# the Chromium sandbox off only where Ubuntu 24.04 forbids it, and a static
# AppImage runtime that needs no libfuse2. See linuxAppImage/README.md.
linux:
  target: dir
  executableName: hdlboard
  icon: build/icon.png
  category: Development
  # There is no installer page to show licenses on, so they sit beside the
  # simulators' own (ghdl/COPYING, iverilog/COPYING) under resources/.
  extraResources:
    - from: ../../LICENSE
      to: licenses/HDLBoard-LICENSE.txt
  extraFiles:
    - from: ../../LICENSE
      to: LICENSE

# macOS: electron-builder lays the app out (`dir`, in mac-arm64/ or mac/), and
# macDmg/build.sh adds the license texts, sets the minimum macOS, signs it
# (macDmg/sign.sh) and packs the DMG itself. See macDmg/README.md.
mac:
  target: dir
  # 1024 px with Apple's icon margin (make-assets.cjs); converted to .icns here.
  icon: build/icon-mac.png
  category: public.app-category.education
  # sign.sh signs, once the simulators and licenses are in the app: a signature
  # made here would be broken by those additions.
  identity: null
  extraResources:
    - from: ../../LICENSE
      to: licenses/HDLBoard-LICENSE.txt
  # The reason macOS shows the first time HDLBoard opens a file in one of these places.
  extendInfo:
    NSDocumentsFolderUsageDescription: HDLBoard keeps your projects in Documents › HDLBoard Projects, unless you choose another folder.
    NSDesktopFolderUsageDescription: HDLBoard opens and saves the projects you keep on the Desktop.
    NSDownloadsFolderUsageDescription: HDLBoard opens the project files you download.
    NSRemovableVolumesUsageDescription: HDLBoard opens and saves projects on a USB stick or other external drive.

win:
  target: nsis
  icon: build/icon.ico
  extraFiles:
    - from: ../../LICENSE
      to: LICENSE
  # Unsigned. SmartScreen will warn on first run; signing is a real cost
  # that is hard to justify for a course tool, so the README documents the
  # "More info -> Run anyway" flow instead.

nsis:
  # A wizard, not a one-click install: students should see where it goes
  # and what it bundles (the license page is how GHDL's attribution is
  # actually shown).
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  license: build/license.txt
  # Welcome/finish panel, generated from the project logo by
  # make-assets.cjs. uninstallerSidebar defaults to this same file.
  installerSidebar: build/installerSidebar.bmp
  # customUnInstall — removes the install directory itself, which
  # electron-builder's uninstaller otherwise leaves behind empty.
  include: build/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: HDLBoard
  artifactName: ${productName}-Setup-${version}.${ext}
  # Leaving a stale install behind would strand an old GHDL copy and an
  # old frontend that the new backend might not match.
  deleteAppDataOnUninstall: false
