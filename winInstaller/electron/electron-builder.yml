#
# Packaging for the Windows desktop build. Everything under `resources/`
# is produced by ../build.ps1 and is gitignored — never hand-edited.

appId: no.usn.de1soc-workbench
productName: DE1-SoC Workbench
copyright: Copyright (C) 2026 Rune Langøy

directories:
  output: ../output
  buildResources: build

# Only the shell itself goes into app.asar. The backend, the frontend and
# GHDL are extraResources instead — see below.
files:
  - main.js
  - package.json

# These sit next to app.asar rather than inside it, under
# `resources/`. GHDL must be a real file on disk for spawn() to execute
# it, and the backend bundle has `ws` inlined precisely because module
# resolution does not reach into the asar from out here (plan F3).
extraResources:
  - from: resources/frontend
    to: frontend
  - from: resources/backend.mjs
    to: backend.mjs
  - from: resources/ghdl
    to: ghdl

# The Workbench's own GPL-2.0 text, installed so license.txt's reference
# to it is true.
extraFiles:
  - from: ../../LICENSE
    to: LICENSE

win:
  target: nsis
  icon: build/icon.ico
  # Unsigned. SmartScreen will warn on first run; signing is a real cost
  # that is hard to justify for a course tool, so the README documents the
  # "More info -> Run anyway" flow instead.

nsis:
  # A wizard, not a one-click install: students should see where it goes
  # and what it bundles (the license page is how GHDL's attribution is
  # actually shown).
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  license: build/license.txt
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DE1-SoC Workbench
  artifactName: ${productName}-Setup-${version}.${ext}
  # Leaving a stale install behind would strand an old GHDL copy and an
  # old frontend that the new backend might not match.
  deleteAppDataOnUninstall: false
