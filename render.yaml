# Render.com Blueprint — see docker/README.md § Render. Builds the Dockerfile's
# last stage (`render`): nginx + backend in one container on port 10000.
services:
  - type: web
    name: hdlboard
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      # Sized for Free (512 MB, 0.1 CPU), where CPU is the limit: with 4
      # simulations running, LEDs follow a switch in about 0.5 s. On Starter
      # (0.5 CPU) 8 sessions stay around 0.2 s; set 8 and 48 there. Keep
      # HDL_MAX_SESSIONS x HDLBOARD_SIM_MEMORY_MB under about 400, so no mix
      # of designs can push the container into the OOM killer. The render
      # stage in docker/Dockerfile has the measurements.
      - key: HDL_MAX_SESSIONS
        value: "4"
      # Memory cap per simulation run, in MB (docker/simlimit.sh).
      - key: HDLBOARD_SIM_MEMORY_MB
        value: "96"
      # When all sessions are in use, the one idle longest is closed to make
      # room for a new student, but not one idle less than this many seconds,
      # unless its address has another session too.
      - key: HDL_IDLE_GRACE_SECONDS
        value: "60"
      # Failing that, one open this many minutes is closed, so the new student
      # is not refused; its student is told why. 0: never close a session.
      - key: HDL_REPLACE_AFTER_MINUTES
        value: "9"
      # The proxies that append to X-Forwarded-For before the backend reads it,
      # measured on a WebSocket (2026-11-15): Render's edge (adds the student)
      # and this container's nginx (adds ::1). The student is the second entry
      # from the right; whatever a client sends itself sits further left and is
      # skipped. Without it every student is 127.0.0.1, and they share one
      # upgrade budget and one grace period (HOSTING.md § 3.1). The Dockerfile
      # sets it too, for a service not made from this Blueprint.
      - key: HDL_TRUSTED_PROXIES
        value: "2"
      # Plain HTTP (the GitHub sign-in routes) passes more proxies than a
      # WebSocket: the student, Cloudflare's edge, Render's balancer, and nginx's
      # ::1 (measured 2026-11-16). A made-up entry from the client sits further
      # left and is skipped. With 2, the sign-in limit would count each
      # Cloudflare edge as one student.
      - key: HDL_TRUSTED_HTTP_PROXIES
        value: "4"
