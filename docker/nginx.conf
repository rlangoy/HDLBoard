# HDLBoard page + WebSocket on one port — HOSTING.md § 8, for Docker.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }

    # A stale shell after an upgrade would load old asset names; the assets
    # themselves are content-hashed by Vite and can be cached forever.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/      { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # /ghdlsim is the endpoint's older name, still proxied for old pages.
    location ~ ^/g?hdlsim$ {
        # Resolve 'backend' per request through Docker's DNS, so a recreated
        # backend container (new IP) doesn't leave nginx pointing at the old one.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:9010;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Simulations sit idle while a student thinks; the 60 s default
        # would close the socket and the board goes dark.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
