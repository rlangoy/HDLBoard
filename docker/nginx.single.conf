# HDLBoard page + WebSocket on one port, backend in the same container — the
# Dockerfile's `render` stage (Render.com and other single-container hosts).
# Same as nginx.conf, except the port and the loopback backend.
server {
    # Render's default PORT. It terminates TLS and forwards to this.
    listen 10000 default_server;
    listen [::]:10000 default_server;
    root /usr/share/nginx/html;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }

    # A stale shell after an upgrade would load old asset names; the assets
    # themselves are content-hashed by Vite and can be cached forever.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/      { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # GitHub sign-in (docs/GITHUB.md): the backend forwards it to github.com, adding
    # the OAuth App's client secret when GITHUB_CLIENT_SECRET is set on it.
    location /github-auth/ {
        proxy_pass http://127.0.0.1:9010;
        proxy_set_header Host $host;
    }

    # /ghdlsim is the endpoint's older name, still proxied for old pages.
    location ~ ^/g?hdlsim$ {
        proxy_pass http://127.0.0.1:9010;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Simulations sit idle while a student thinks; the 60 s default
        # would close the socket and the board goes dark.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
