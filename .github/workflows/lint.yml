#
# The frontend's Clean Code rules (eslint.config.js) on every push to main and
# every pull request. The release builds only run on a version tag, too late
# to catch a rule broken weeks earlier.

name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
